services:
  backend:
    build:
      context: ./backend-springboot
    container_name: ordercare-backend
    ports:
      - "5000:5000"
    environment:
      ZEEBE_GRPC_ADDRESS: ${ZEEBE_GRPC_ADDRESS:-http://host.docker.internal:26500}
      ZEEBE_REST_ADDRESS: ${ZEEBE_REST_ADDRESS:-http://host.docker.internal:8080}
    volumes:
      - ordercare-h2-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
    container_name: ordercare-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ordercare-h2-data:
